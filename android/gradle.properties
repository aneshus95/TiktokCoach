# Project-wide Gradle settings.
# Flipper
FLIPPER_VERSION=0.125.0

# Hermes engine
hermesEnabled=true
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

# Enable R8 full mode (recommended for release builds)
android.enableR8.fullMode=true

# ========================================
# RELEASE SIGNING CONFIGURATION
# ========================================
# IMPORTANT: DO NOT commit these values to Git!
# Add these lines to your ~/.gradle/gradle.properties instead
# Or create android/gradle.properties (add to .gitignore)
#
MYAPP_RELEASE_STORE_FILE=my-release-key.keystore
MYAPP_RELEASE_KEY_ALIAS=my-key-alias
MYAPP_RELEASE_STORE_PASSWORD=Torchapp@123
MYAPP_RELEASE_KEY_PASSWORD=Torchapp@123
#
# These will be read by android/app/build.gradle during release builds
# ========================================
FLIPPER_VERSION=0.125.0
